<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar · NEONS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#050508; --panel:#0c0c14; --panel2:#101018;
  --txt:#eef0ff; --mut:#8b8fb0; --dim:#5d6182;
  --c1:#00f0ff; --c2:#b04dff; --ok:#39ff88; --err:#ff4d5e;
  --line:rgba(255,255,255,.08); --line2:rgba(0,240,255,.3);
  --ease:cubic-bezier(.22,1,.36,1);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(620px 360px at 50% -10%,rgba(0,240,255,.10),transparent 65%)}
h1,h2{font-family:'Space Grotesk',Inter,sans-serif;margin:0}
a{color:var(--c1)}
.wrap{width:100%;max-width:400px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:22px;text-align:center}
.brand .logo{font-family:'Space Grotesk';font-weight:700;font-size:27px;letter-spacing:3px;
  background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
h2.title{font-size:19px;margin-bottom:4px}
p.sub{margin:0 0 20px;color:var(--mut);font-size:13.5px;text-align:center}
label{display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:14px}
label .hint{font-weight:500;color:var(--dim);font-size:11.5px}
input{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);
  color:var(--txt);font:inherit;outline:none;transition:.2s var(--ease)}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,240,255,.13)}
input[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 3px rgba(255,77,94,.14)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;
  font-family:'Space Grotesk',sans-serif;color:#05050a;background:linear-gradient(135deg,var(--c1),var(--c2));
  transition:.2s var(--ease)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--c1);border:1px solid var(--line2)}
.btn.ghost:hover{background:rgba(0,240,255,.08)}
.msg{min-height:18px;margin:12px 0 0;font-size:13px;font-weight:600;text-align:center;color:var(--err)}
.msg.ok{color:var(--ok)}
.foot{margin-top:18px;text-align:center;font-size:13px;color:var(--mut)}
.foot button{border:0;background:none;color:var(--c1);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.back{display:block;margin-top:20px;text-align:center;width:100%;color:var(--mut);font-size:13px;text-decoration:none}
.back:hover{color:var(--c1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#05050a;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo">NEONS</span><small>achadinhos</small></div>
  <div class="box">
    <h2 class="title" id="title">Entrar</h2>
    <p class="sub" id="sub">Acesse sua conta para ver pedidos e favoritos.</p>
    <form id="form" novalidate>
      <label id="lblNome" hidden>Nome completo<input id="f_nome" type="text" autocomplete="name" placeholder="Como quer ser chamado"></label>
      <label>E-mail<input id="f_email" type="email" autocomplete="email" placeholder="voce@email.com" required></label>
      <label>Senha<input id="f_pass" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
        <span class="hint" id="passHint">Mínimo de 6 caracteres.</span></label>
      <button class="btn" id="submit" type="submit">Entrar</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <button class="btn ghost" id="forgot" type="button">Esqueci minha senha</button>
    <p class="foot" id="foot">Não tem conta? <button type="button" id="goSignup">Criar conta</button></p>
  </div>
  <a class="back" href="index.html">← Voltar para a loja</a>
</div>
<script src="config.js"></script>
<script src="config.local.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="auth.js"></script>
<script>
/* Tela de login. Toda a parte pesada (sessão, perfil, erros) vive em auth.js. */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var form = $('#form'), email = $('#f_email'), pass = $('#f_pass'),
      nome = $('#f_nome'), msg = $('#msg'), sub = $('#submit'), lblNome = $('#lblNome'),
      passHint = $('#passHint'), forgot = $('#forgot'), foot = $('#foot'), title = $('#title'), sub2 = $('#sub');
  var mode = 'signin';

  function say(text, ok) {
    msg.textContent = text || '';
    msg.className = 'msg' + (ok ? ' ok' : '');
  }
  function busy(on) {
    sub.disabled = on;
    sub.innerHTML = on ? '<span class="spin"></span> Aguarde…'
                        : (mode === 'signup' ? 'Criar conta' : 'Entrar');
    forgot.disabled = on;
  }
  function setMode(next) {
    mode = next;
    var signup = mode === 'signup';
    title.textContent = signup ? 'Criar conta' : 'Entrar';
    sub2.textContent = signup ? 'Leva menos de um minuto.'
                               : 'Acesse sua conta para ver pedidos e favoritos.';
    lblNome.hidden = !signup;
    pass.setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
    pass.placeholder = signup ? 'Crie uma senha forte' : '••••••••';
    passHint.hidden = !signup;
    forgot.hidden = signup;
    foot.innerHTML = signup
      ? 'Já tem conta? <button type="button" id="goSignin">Entrar</button>'
      : 'Não tem conta? <button type="button" id="goSignup">Criar conta</button>';
    var sw = $('#goSignin'), su = $('#goSignup');
    if (su) su.onclick = function () { setMode('signup'); say(''); };
    if (sw) sw.onclick = function () { setMode('signin'); say(''); };
    say('');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var mail = email.value.trim(), pw = pass.value;
    email.setAttribute('aria-invalid', 'false');
    pass.setAttribute('aria-invalid', 'false');
    if (!mail || mail.indexOf('@') < 1) {
      email.setAttribute('aria-invalid', 'true'); email.focus();
      return say('Digite um e-mail válido.');
    }
    if (pw.length < 6) {
      pass.setAttribute('aria-invalid', 'true'); pass.focus();
      return say('A senha precisa de pelo menos 6 caracteres.');
    }
    busy(true); say('');
    var p = mode === 'signup'
      ? Auth.signUp({ email: mail, password: pw, nome: nome.value.trim() })
      : Auth.signIn({ email: mail, password: pw });
    p.then(function (r) {
      busy(false);
      if (!r.ok) return say(r.error || 'Não foi possível continuar.');
      if (r.needsConfirmation) {
        say('Conta criada! Confirme o e-mail que enviamos e depois entre.', true);
        setMode('signin');
        return;
      }
      /* destino validado: só caminho interno, nunca URL absoluta */
      location.replace(Auth.consumeReturnTo('index.html'));
    }).catch(function (err) {
      busy(false);
      say((err && err.message) || 'Falha inesperada. Tente de novo.');
    });
  });

  forgot.addEventListener('click', function () {
    var mail = email.value.trim();
    if (!mail || mail.indexOf('@') < 1) {
      email.setAttribute('aria-invalid', 'true'); email.focus();
      return say('Digite seu e-mail antes de pedir a recuperação.');
    }
    busy(true);
    Auth.resetPassword(mail).then(function (r) {
      busy(false);
      /* resposta igual exista ou não a conta: não revela cadastros */
      say(r.ok ? 'Se o e-mail existir, o link de recuperação foi enviado.'
               : (r.error || 'Não foi possível enviar.'), r.ok);
    });
  });

  setMode('signin');
  /* já logado? vai direto */
  Auth.ready().then(function (s) {
    if (s.status === 'authed') location.replace(Auth.consumeReturnTo('index.html'));
  });
})();
</script>
</body>
</html>
